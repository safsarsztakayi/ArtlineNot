    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-color:var(--wood-dark);
  }

  /* HEADER */
  header{
    background:linear-gradient(180deg, rgba(61,38,24,.92), rgba(61,38,24,.96));
    backdrop-filter:blur(2px);
    color:#f2e6cf;
    padding:14px 20px 0 20px;
    flex-shrink:0;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
    position:relative;
    z-index:50;
  }
  header h1{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:26px;
    margin:0 0 10px 2px;
    letter-spacing:.5px;
    text-shadow:0 2px 0 rgba(0,0,0,.3);
  }

  .mode-switch{display:flex;gap:8px;margin-bottom:10px;}
  .mode-btn{
    font-family:'Kalam',cursive;
    font-size:15px;
    border:2px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.25);
    color:#f2e6cf;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, transform .12s ease;
  }
  .mode-btn:hover{transform:translateY(-1px);}
  .mode-btn.active{background:var(--mode-active);border-color:var(--mode-active);}

  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'Kalam',cursive;
    font-size:15px;
    border:none;
    padding:9px 16px 11px 16px;
    cursor:pointer;
    color:#2b1c10;
    border-radius:8px 8px 0 0;
    position:relative;
    top:2px;
    transition:transform .12s ease, top .12s ease;
    box-shadow:0 -2px 0 rgba(0,0,0,.08) inset;
  }
  .tab-btn:hover{transform:translateY(-2px);}
  .tab-btn.active{top:0;box-shadow:0 3px 8px rgba(0,0,0,.35);}
  .tab-home{background:var(--paper);color:var(--ink);}
  .tab-1{background:var(--tab-1);}
  .tab-2{background:var(--tab-2);color:#f4e9cf;}
  .tab-3{background:var(--tab-3);color:#f4e9cf;}
  .tab-4{background:var(--tab-4);color:#f4e9cf;}
  .tab-char{background:var(--panel);color:var(--ink);}

  .dropdown{
    display:none;
    position:absolute;
    top:100%;
    background:var(--panel);
    border:1px solid rgba(0,0,0,.25);
    border-radius:0 0 10px 10px;
    box-shadow:0 8px 18px rgba(0,0,0,.4);
    padding:8px;
    gap:6px;
    flex-direction:column;
    min-width:190px;
    z-index:60;
  }
  .dropdown.open{display:flex;}
  .dropdown button{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:9px 12px;
    border:none;
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
    text-align:left;
    cursor:pointer;
    border-left:4px solid var(--ink-soft);
  }
  .dropdown button:hover{background:#fff;border-left-color:var(--thread);}

  /* BREADCRUMB */
  .crumb{
    background:var(--panel);
    padding:8px 18px;
    font-family:'Kalam',cursive;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
    border-bottom:1px solid rgba(0,0,0,.15);
  }
  .crumb button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    background:var(--wood);
    color:#f4e9cf;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .crumb button:hover{background:var(--wood-dark);}

  /* MAIN LAYOUT */
  main{flex:1;display:flex;min-height:0;position:relative;}

  /* SIDEBAR TOOLBAR */
  .toolbar{
    width:84px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--wood),var(--wood-dark));
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 8px;
    gap:14px;
    box-shadow:3px 0 10px rgba(0,0,0,.3);
    z-index:10;
  }
  .tool-btn{
    width:100%;
    background:var(--paper);
    border:none;
    border-radius:8px;
    padding:10px 4px 8px 4px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    box-shadow:0 3px 6px rgba(0,0,0,.35);
    transition:transform .1s ease;
  }
  .tool-btn:hover{transform:translateY(-2px);}
  .tool-btn:active{transform:translateY(0);}
  .tool-btn .ic{font-size:20px;}
  .tool-btn .lb{font-family:'Kalam',cursive;font-size:12px;color:var(--ink);}
  .tool-btn.active-tool{background:var(--thread);}
  .tool-btn.active-tool .lb{color:#fff;}
  .tool-hint{
    margin-top:auto;
    font-size:10px;
    color:#e6d6b8;
    text-align:center;
    font-family:'Inter',sans-serif;
    line-height:1.4;
  }

  /* CANVAS */
  .canvas-wrap{flex:1;overflow:auto;position:relative;background:var(--cork-a);}
  .canvas-wrap::-webkit-scrollbar{width:12px;height:12px;}
  .canvas-wrap::-webkit-scrollbar-thumb{background:var(--wood);border-radius:6px;}
  #canvas{
    position:relative;
    width:2600px;
    height:1700px;
    background-color:var(--cork-a);
    background-image:
      radial-gradient(circle at 8px 8px, var(--cork-c) 1px, transparent 1.2px),
      radial-gradient(circle at 22px 18px, var(--cork-b) .8px, transparent 1px),
      radial-gradient(ellipse at 20% 15%, rgba(90,60,140,.25) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 70%, rgba(40,80,160,.22) 0%, transparent 45%),
      radial-gradient(ellipse at 55% 90%, rgba(140,60,110,.18) 0%, transparent 50%);
    background-size:60px 60px, 60px 60px, 100% 100%, 100% 100%, 100% 100%;
  }
  .glow-layer{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0;}
  .glow-blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.5;
    background:radial-gradient(circle, rgba(140,110,255,.55) 0%, rgba(90,70,180,.25) 45%, transparent 75%);
  }
  .glow-blob.b1{width:520px;height:520px;top:-120px;left:-100px;animation:driftA 34s ease-in-out infinite;}
  .glow-blob.b2{width:620px;height:620px;top:600px;left:1400px;background:radial-gradient(circle, rgba(90,180,255,.5) 0%, rgba(60,120,220,.22) 45%, transparent 75%);animation:driftB 42s ease-in-out infinite;}
  .glow-blob.b3{width:420px;height:420px;top:1200px;left:300px;background:radial-gradient(circle, rgba(255,110,190,.4) 0%, rgba(180,70,150,.2) 45%, transparent 75%);animation:driftC 28s ease-in-out infinite;}
  @keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(120px,80px);}}
  @keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-140px,60px);}}
  @keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(90px,-100px);}}
  .star{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, #fffbea 0%, rgba(255,251,234,.6) 45%, transparent 72%);
    box-shadow:0 0 6px 1px rgba(255,246,214,.55);
    pointer-events:none;
    z-index:0;
    animation-name:twinkle;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.12;transform:scale(.85);}
    50%{opacity:var(--star-op,.85);transform:scale(1);}
  }
  .empty-hint{
    position:absolute;
    z-index:1;
    top:40px;left:50%;transform:translateX(-50%);
    font-family:'Kalam',cursive;
    font-size:18px;
    color:rgba(58,42,29,.55);
    background:rgba(251,243,222,.55);
    padding:10px 18px;
    border-radius:10px;
    pointer-events:none;
    max-width:340px;
    text-align:center;
  }
  svg.threads{position:absolute;top:0;left:0;pointer-events:none;z-index:1;}
  .thread-del{
    pointer-events:all;
    cursor:pointer;
  }

  /* CARDS */
  .card{
    position:absolute;
    box-shadow:2px 4px 10px rgba(0,0,0,.35);
    border-radius:3px;
    user-select:none;
  }
  .card.text-card{background:var(--paper);border:1px solid var(--paper-edge);}
  .card.image-card{background:#fff;border:1px solid #ddd;padding:0;}
  .card.selected-for-link{outline:3px solid var(--thread);outline-offset:2px;}
  .card-header{
    height:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px 0 8px;
    cursor:grab;
    background:rgba(0,0,0,.04);
  }
  .card.image-card .card-header{background:rgba(0,0,0,.55);}
  .card-header:active{cursor:grabbing;}
  .pin{
    width:11px;height:11px;border-radius:50%;
    box-shadow:0 1px 2px rgba(0,0,0,.5);
    flex-shrink:0;
  }
  .pin.text-pin{background:var(--pin-text);}
  .pin.image-pin{background:var(--pin-image);}
  .del-btn{
    border:none;background:transparent;
    color:var(--ink-soft);
    font-size:14px;line-height:1;
    cursor:pointer;
    padding:2px 4px;
  }
  .card.image-card .del-btn{color:#eee;}
  .del-btn:hover{color:var(--thread);}
  .card-body{
    padding:8px 10px 10px 10px;
    font-family:'Kalam',cursive;
    font-size:15px;
    line-height:1.35;
    color:var(--ink);
    outline:none;
    overflow:auto;
    height:calc(100% - 22px);
  }
  .card-body:empty:before{
    content:attr(data-placeholder);
    color:rgba(58,42,29,.45);
  }
  .card.sticky-mode-on .card-body{cursor:crosshair;}
  .card.sticky-mode-on{cursor:crosshair;}
  .image-card img{
    width:100%;
    height:calc(100% - 22px - 30px);
    object-fit:cover;
    display:block;
  }
  .image-caption{
    height:30px;
    font-family:'Kalam',cursive;
    font-size:13px;
    padding:4px 8px;
    color:var(--ink);
    outline:none;
    text-align:center;
  }
  .image-caption:empty:before{content:attr(data-placeholder);color:#999;}
  .resize-handle{
    position:absolute;
    width:14px;height:14px;
    right:0;bottom:0;
    cursor:nwse-resize;
    background:linear-gradient(135deg,transparent 50%, rgba(0,0,0,.35) 50%);
    border-radius:0 0 3px 0;
  }

  /* GOALS PANEL */
  #goalsPanel{
    flex:1;
    overflow:auto;
    padding:20px;
    display:none;
    gap:16px;
    background:rgba(30,18,10,.55);
  }
  .goals-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
    max-width:1400px;
    margin:0 auto;
  }
  .goal-col{
    background:rgba(251,243,222,.95);
    border-radius:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    display:flex;
    flex-direction:column;
    min-height:180px;
  }
  .goal-col-head{
    font-family:'Kalam',cursive;
    font-size:16px;
    font-weight:700;

<body>

<input type="file" id="fileInput" accept="image/*" style="display:none;">
<div class="toast" id="toast"></div>

<!-- Firebase SDK (paylaşımlı kayıt için) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ---------------- FIREBASE CONFIG ----------------
  1) https://console.firebase.google.com adresine git, ücretsiz bir proje oluştur.
  2) Sol menüden "Build > Realtime Database" seç, "Create Database" ile bir veritabanı aç
     (test mode / lokasyon farketmez, ücretsiz plan yeterli).
  3) Proje ayarları (dişli ikonu) > "Your apps" > Web app (</>) ekle, sana bir
     firebaseConfig objesi verecek. Aşağıdaki objeyi onunla değiştir.
  4) Realtime Database > Rules sekmesinde şunu yapıştır (herkese açık ama sadece
     bu anahtarı bilenler okuyup yazabilsin istiyorsan .read/.write true bırakabilirsin,
     daha güvenli istersen kendi kurallarını yaz):
     {
       "rules": { ".read": true, ".write": true }
     }
------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyCrOAu07gqUFgzvIqRMbU_6ErhMe1TCjRg",
  authDomain: "artlinenot.firebaseapp.com",
  databaseURL: "https://artlinenot-default-rtdb.firebaseio.com",
  projectId: "artlinenot",
  storageBucket: "artlinenot.firebasestorage.app",
  messagingSenderId: "118330130390",
  appId: "1:118330130390:web:1cdb3ddaf346066f9f6e77"
};
let firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  firebaseReady = true;
}catch(e){
  console.error('Firebase başlatılamadı, firebaseConfig doldurulmamış olabilir:', e);
}

/* ---------------- CONFIG ---------------- */
const CANVAS_W = 2600, CANVAS_H = 1700;
const STORAGE_KEY = 'ortak-pano-data';
const CHARACTERS = ['Kotoma Senju','Sano Tsukishiro','Yuto Sora'];
const CATEGORIES = [
  {id:'dusunulen-roller', label:'Düşünülen Roller', cls:'tab-1'},
  {id:'yapilacak-roller', label:'Yapılacak Roller', cls:'tab-2'},
  {id:'dusunulen-rol-paslari', label:'Düşünülen Rol Pasları', cls:'tab-3'},
  {id:'iliskiler-baglantilar', label:'İlişkiler ve Bağlantılar', cls:'tab-4'},
];
const GOAL_CATS = [
  {key:'suanki', label:'Şu Anki Hedef'},
  {key:'kisa', label:'Kısa Vadeli Hedef'},
  {key:'uzun', label:'Uzun Vadeli Hedef'},
  {key:'gizli', label:'Gizli Hedef'},
  {key:'ortak', label:'Ortak Hedef'},
];
const STATUSES = [
  {key:'fikir', emoji:'💭', label:'Fikir'},
  {key:'hazirlaniyor', emoji:'📝', label:'Hazırlanıyor'},
  {key:'yapiliyor', emoji:'🎭', label:'Yapılıyor'},
  {key:'devam', emoji:'⏳', label:'Devam Edecek'},
  {key:'yapildi', emoji:'✅', label:'Yapıldı'},
  {key:'vazgecildi', emoji:'❌', label:'Vazgeçildi'},
];
const PLAN_FIELDS = [
  {key:'amac', label:'Planın Amacı', type:'textarea'},
  {key:'neden', label:'Neden Yapıyoruz', type:'textarea'},
  {key:'kimlerBiliyor', label:'Kimler Biliyor', type:'textarea'},
  {key:'kimlerdenGizli', label:'Kimlerden Gizli', type:'textarea'},
  {key:'ilkHamle', label:'İlk Hamle', type:'textarea'},
  {key:'sonrakiHamle', label:'Sonraki Hamle', type:'textarea'},
  {key:'riskler', label:'Riskler', type:'textarea'},
  {key:'istenenSonuc', label:'İstenen Sonuç', type:'textarea'},
];

/* ---------------- STATE ---------------- */
let appState = { boards: {}, goals: {}, plans: [] };
let currentMode = 'pano'; // pano | hedefler | planlar
let currentBoardId = 'main';
let currentGoalChar = CHARACTERS[0];
let currentTool = null;      // 'text' | 'image' | 'sticky'
let stickyFirstId = null;
let zTop = 10;
let dirty = false;

/* ambient starfield — generated once, stays stable across re-renders */
const STARS = (() => {
  const list = [];
  for(let i=0; i<90; i++){
    list.push({
      x: Math.random() * CANVAS_W,
      y: Math.random() * CANVAS_H,
      size: 1.5 + Math.random() * 2.5,
      delay: (Math.random() * 6).toFixed(2),
      duration: (2.5 + Math.random() * 3.5).toFixed(2),
      op: (0.5 + Math.random() * 0.5).toFixed(2)
    });
  }
  return list;
})();
function buildAmbientLayerHtml(){
  const starsHtml = STARS.map(s =>
    `<div class="star" style="left:${s.x.toFixed(1)}px;top:${s.y.toFixed(1)}px;width:${s.size}px;height:${s.size}px;animation-delay:${s.delay}s;animation-duration:${s.duration}s;--star-op:${s.op};"></div>`
  ).join('');
  return `<div class="glow-layer">
    <div class="glow-blob b1"></div>
    <div class="glow-blob b2"></div>
    <div class="glow-blob b3"></div>
    ${starsHtml}
  </div>`;
}

function slug(s){ return s.toLowerCase().replace(/\s+/g,'-'); }
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function ensureBoard(id){
  if(!appState.boards[id]) appState.boards[id] = { elements: [], connections: [] };
  return appState.boards[id];
}
function getBoard(){ return ensureBoard(currentBoardId); }

function ensureGoals(){
  if(!appState.goals) appState.goals = {};
  CHARACTERS.forEach(ch => {
    if(!appState.goals[ch]) appState.goals[ch] = {};
    GOAL_CATS.forEach(c => {
      if(!Array.isArray(appState.goals[ch][c.key])) appState.goals[ch][c.key] = [];
    });
  });
}
function ensurePlans(){
  if(!Array.isArray(appState.plans)) appState.plans = [];
}

/* ---------------- STORAGE ---------------- */
async function loadFromStorage(){
  setStatus('Yükleniyor…');
  if(!firebaseReady){
    setStatus('⚠️ Firebase ayarlanmamış (firebaseConfig doldurulmadı), kayıt/yükleme çalışmaz.');
    ensureBoard('main');
    ensureGoals();
    ensurePlans();
    renderAll();
    return;
  }
  try{
    const snap = await firebase.database().ref(STORAGE_KEY).once('value');
    const parsed = snap.val();
    if(parsed){
      appState = {
        boards: parsed.boards || {},
        goals: parsed.goals || {},
        plans: parsed.plans || []
      };
    }
    setStatus('Yüklendi.');
  }catch(err){
    setStatus('Henüz kayıt yok veya bağlantı hatası, boş pano açıldı.');
    console.error(err);
  }
  ensureBoard('main');
  ensureGoals();
  ensurePlans();
  renderAll();
}

async function saveToStorage(){
  if(!firebaseReady){
    showToast('Kaydedilemedi: firebaseConfig doldurulmamış. Kodun başındaki BURAYA_... alanlarını kendi Firebase projenle değiştir.');
    setStatus('Kayıt yapılamıyor (Firebase ayarlı değil).');
    return;
  }
  try{
    await firebase.database().ref(STORAGE_KEY).set(JSON.parse(JSON.stringify(appState)));
    dirty = false;
    showToast('Kaydedildi. Arkadaşın panoyu açtığında görecek.');
    setStatus('Kaydedildi.');
  }catch(err){
    showToast('Kaydetme hatası: ' + err);
    console.error(err);
  }
}

/* ---------------- UI HELPERS ---------------- */
function setStatus(t){ document.getElementById('status').textContent = t; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------------- MODE SWITCH ---------------- */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});
function setMode(mode){
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

  document.getElementById('panoToolbar').style.display = (mode === 'pano') ? 'flex' : 'none';
  document.getElementById('canvasWrap').style.display = (mode === 'pano') ? 'block' : 'none';
  document.getElementById('goalsPanel').style.display = (mode === 'hedefler') ? 'flex' : 'none';
  document.getElementById('plansPanel').style.display = (mode === 'planlar') ? 'block' : 'none';
  document.getElementById('crumb').style.display = (mode === 'pano' && currentBoardId !== 'main') ? 'flex' : 'none';

  if(mode === 'pano'){
    buildPanoTabs();
    render();
  } else if(mode === 'hedefler'){
    buildGoalCharTabs();
    renderGoalsPanel();
  } else if(mode === 'planlar'){
    document.getElementById('tabs').innerHTML = '';
    renderPlansPanel();
  }
}

/* ---------------- NAV / TABS (PANO) ---------------- */
function buildPanoTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';

  const homeBtn = document.createElement('button');
  homeBtn.className = 'tab-btn tab-home' + (currentBoardId==='main' ? ' active' : '');
  homeBtn.textContent = 'Ana Pano';
  homeBtn.onclick = () => { closeAllDropdowns(); goToBoard('main'); };
  tabsEl.appendChild(homeBtn);

  CATEGORIES.forEach(cat => {
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';

    const btn = document.createElement('button');
    const isActiveCat = currentBoardId.startsWith(cat.id + '::');
    btn.className = 'tab-btn ' + cat.cls + (isActiveCat ? ' active' : '');
    btn.textContent = cat.label;
    btn.onclick = (e) => {
      e.stopPropagation();
      toggleDropdown(cat.id);
    };
    wrap.appendChild(btn);

    const dd = document.createElement('div');
    dd.className = 'dropdown';
    dd.id = 'dd-' + cat.id;
    CHARACTERS.forEach(ch => {
      const b = document.createElement('button');
      b.textContent = ch;
      b.onclick = (e) => {
        e.stopPropagation();
        closeAllDropdowns();
        goToBoard(cat.id + '::' + slug(ch), cat.label, ch);
      };
      dd.appendChild(b);
    });
    wrap.appendChild(dd);
    tabsEl.appendChild(wrap);
  });
}
function toggleDropdown(catId){
  const dd = document.getElementById('dd-' + catId);
  const isOpen = dd.classList.contains('open');
  closeAllDropdowns();
  if(!isOpen) dd.classList.add('open');
}
function closeAllDropdowns(){
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
}
document.addEventListener('click', closeAllDropdowns);

function goToBoard(id, catLabel, charLabel){
  currentBoardId = id;
  ensureBoard(id);
  const crumb = document.getElementById('crumb');
  if(id === 'main'){
    crumb.style.display = 'none';
  } else {
    crumb.style.display = 'flex';
    crumb.innerHTML = '';
    const back = document.createElement('button');
    back.textContent = '← Ana Pano';
    back.onclick = () => goToBoard('main');
    crumb.appendChild(back);
    const label = document.createElement('span');
    label.textContent = (catLabel || guessLabels(id).cat) + ' · ' + (charLabel || guessLabels(id).char);
    crumb.appendChild(label);
  }
  buildPanoTabs();
  render();
}
function guessLabels(id){
  const [catId, charSlug] = id.split('::');
  const cat = CATEGORIES.find(c => c.id === catId);
  const char = CHARACTERS.find(c => slug(c) === charSlug);
  return { cat: cat ? cat.label : '', char: char || '' };
}

/* ---------------- TOOLS ---------------- */
document.getElementById('tool-text').onclick = () => addTextCard();
document.getElementById('tool-image').onclick = () => document.getElementById('fileInput').click();
document.getElementById('tool-sticky').onclick = () => {
  currentTool = (currentTool === 'sticky') ? null : 'sticky';
  stickyFirstId = null;
  updateToolButtons();
  render();
};
function updateToolButtons(){
  document.getElementById('tool-sticky').classList.toggle('active-tool', currentTool === 'sticky');
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = () => addImageCard(reader.result, i);
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

function randomOffset(){ return Math.floor(Math.random()*40) - 20; }
function spawnPos(w,h){
  const wrap = document.getElementById('canvasWrap');
  const x = Math.max(20, wrap.scrollLeft + wrap.clientWidth/2 - w/2 + randomOffset());
  const y = Math.max(20, wrap.scrollTop + wrap.clientHeight/2 - h/2 + randomOffset());
  return {x,y};
}

function addTextCard(){
  const w=200,h=150;
  const {x,y} = spawnPos(w,h);
  const el = {
    id: uid(), type:'text', x, y, w, h,
    text:'', rot:(Math.random()*6-3), z:++zTop
  };
  getBoard().elements.push(el);
  dirty = true;
  render();
  setTimeout(()=>{
    const node = document.querySelector('[data-id="'+el.id+'"] .card-body');
    if(node) node.focus();
  }, 30);
}
function addImageCard(dataUrl, idx){
  const img = new Image();
  img.onload = () => {
    const w = 220;
    let photoH = Math.round(w * (img.naturalHeight / img.naturalWidth));
    photoH = Math.min(Math.max(photoH, 80), 420);
    const totalH = 22 + photoH + 30; // header + photo + caption
    const {x,y} = spawnPos(w, totalH);
    const el = {
      id: uid(), type:'image', x: x + idx*24, y: y + idx*24, w, h: totalH,
      src: dataUrl, caption:'', rot:(Math.random()*6-3), z:++zTop
    };
    getBoard().elements.push(el);
    dirty = true;
    render();
  };
  img.onerror = () => {
    const w = 220, totalH = 22 + 200 + 30;
    const {x,y} = spawnPos(w, totalH);
    const el = { id: uid(), type:'image', x: x+idx*24, y: y+idx*24, w, h: totalH, src: dataUrl, caption:'', rot:(Math.random()*6-3), z:++zTop };
    getBoard().elements.push(el);
    dirty = true;
    render();
  };
  img.src = dataUrl;
}
function deleteElement(id){
  const b = getBoard();
  b.elements = b.elements.filter(e => e.id !== id);
  b.connections = b.connections.filter(c => c.from !== id && c.to !== id);
  dirty = true;
  render();
}
function deleteConnection(connId){
  const b = getBoard();
  b.connections = b.connections.filter(c => c.id !== connId);
  dirty = true;
  render();
}
function handleStickyClick(id){
  if(stickyFirstId === null){
    stickyFirstId = id;
    render();
  } else if(stickyFirstId === id){
    stickyFirstId = null;
    render();
  } else {
    getBoard().connections.push({ id: uid(), from: stickyFirstId, to: id });
    stickyFirstId = null;
    dirty = true;
    render();
  }
}

/* ---------------- RENDER: PANO BOARD ---------------- */
function render(){
  const board = getBoard();
  const canvas = document.getElementById('canvas');
  canvas.style.width = CANVAS_W + 'px';
  canvas.style.height = CANVAS_H + 'px';

  let html = '';
  html += buildAmbientLayerHtml();

  let svgInner = buildThreadsSvg(board);
  html += `<svg class="threads" width="${CANVAS_W}" height="${CANVAS_H}">${svgInner}</svg>`;

  if(board.elements.length === 0){
    html += `<div class="empty-hint">Panoya not eklemek için soldaki Text, Image veya Sticky araçlarını kullan.</div>`;
  }

  board.elements.forEach(el => {
    const stickyOn = currentTool === 'sticky';
    const selected = stickyFirstId === el.id;
    const rotStyle = `transform:rotate(${el.rot||0}deg);`;
    if(el.type === 'text'){
      html += `
      <div class="card text-card${stickyOn?' sticky-mode-on':''}${selected?' selected-for-link':''}" data-id="${el.id}"
           style="left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;${rotStyle}z-index:${el.z||1};">
        <div class="card-header" data-role="drag">
          <span class="pin text-pin"></span>
          <button class="del-btn" data-role="delete" title="Sil">✕</button>
        </div>
        <div class="card-body" data-role="edit" contenteditable="${!stickyOn}" data-placeholder="Buraya yaz…">${escapeHtml(el.text||'')}</div>
        <div class="resize-handle" data-role="resize"></div>
      </div>`;
    } else {
      html += `
      <div class="card image-card${stickyOn?' sticky-mode-on':''}${selected?' selected-for-link':''}" data-id="${el.id}"
           style="left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;${rotStyle}z-index:${el.z||1};">
        <div class="card-header" data-role="drag">
          <span class="pin image-pin"></span>
          <button class="del-btn" data-role="delete" title="Sil">✕</button>
        </div>
        <img src="${el.src}" draggable="false">
        <div class="image-caption" data-role="caption" contenteditable="${!stickyOn}" data-placeholder="not ekle…">${escapeHtml(el.caption||'')}</div>
        <div class="resize-handle" data-role="resize"></div>
      </div>`;
    }
  });

  canvas.innerHTML = html;
  attachCardEvents();
}

function buildThreadsSvg(board){
  let svgInner = '';
  board.connections.forEach(conn => {
    const a = board.elements.find(e => e.id === conn.from);
    const b = board.elements.find(e => e.id === conn.to);
    if(!a || !b) return;
    const ax = a.x + a.w/2, ay = a.y + a.h/2;
    const bx = b.x + b.w/2, by = b.y + b.h/2;
    const mx = (ax+bx)/2, my = (ay+by)/2;
    const dx = bx-ax, dy = by-ay;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    const nx = -dy/dist, ny = dx/dist;
    const sag = Math.min(30, dist*0.08);
    const cx = mx + nx*sag, cy = my + ny*sag;
    svgInner += `<path d="M ${ax} ${ay} Q ${cx} ${cy} ${bx} ${by}" stroke="var(--thread)" stroke-width="2.5" fill="none" opacity="0.85"/>`;
    svgInner += `<circle class="thread-del" data-conn="${conn.id}" cx="${cx}" cy="${cy}" r="8" fill="#fff" stroke="var(--thread)" stroke-width="1.5"/>`;
    svgInner += `<text class="thread-del" data-conn="${conn.id}" x="${cx}" y="${cy+3}" text-anchor="middle" font-size="10" fill="var(--thread)" style="pointer-events:none;">✕</text>`;
  });
  return svgInner;
}

/* ---------------- CARD INTERACTIONS ---------------- */
function attachCardEvents(){
  const stickyOn = currentTool === 'sticky';

  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;

    card.addEventListener('click', (e) => {
      if(stickyOn){
        e.preventDefault();
        e.stopPropagation();
        handleStickyClick(id);
      }
    });

    const delBtn = card.querySelector('[data-role="delete"]');
    if(delBtn){
      delBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); });
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteElement(id);
      });
    }

    const dragHandle = card.querySelector('[data-role="drag"]');
    if(dragHandle && !stickyOn){
      dragHandle.addEventListener('mousedown', (e) => {
        if(e.target.closest('[data-role="delete"]')) return;
        startDrag(e, id);
      });
    }

    const resizeHandle = card.querySelector('[data-role="resize"]');
    if(resizeHandle && !stickyOn){
      resizeHandle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startResize(e, id);
      });
    }

    const editArea = card.querySelector('[data-role="edit"]');
    if(editArea){
      editArea.addEventListener('input', (e) => {
        const el = getBoard().elements.find(x => x.id === id);
        if(el){ el.text = e.target.innerText; dirty = true; }
      });
    }
    const capArea = card.querySelector('[data-role="caption"]');
    if(capArea){
      capArea.addEventListener('input', (e) => {
        const el = getBoard().elements.find(x => x.id === id);
        if(el){ el.caption = e.target.innerText; dirty = true; }
      });
    }
  });

  document.querySelectorAll('.thread-del').forEach(node => {
    node.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteConnection(node.dataset.conn);
    });
  });
}

function bringToFront(id){
  const el = getBoard().elements.find(x => x.id === id);
  if(el){ el.z = ++zTop; }
}

function startDrag(e, id){
  e.preventDefault();
  bringToFront(id);
  const el = getBoard().elements.find(x => x.id === id);
  if(!el) return;
  const startX = e.clientX, startY = e.clientY;
  const origX = el.x, origY = el.y;
  const cardNode = document.querySelector('[data-id="'+id+'"]');
  cardNode.style.zIndex = el.z;
  let moved = false;

  function onMove(ev){
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    el.x = Math.max(0, Math.min(CANVAS_W - el.w, origX + dx));
    el.y = Math.max(0, Math.min(CANVAS_H - el.h, origY + dy));
    cardNode.style.left = el.x + 'px';
    cardNode.style.top = el.y + 'px';
    redrawThreadsOnly();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if(moved){ dirty = true; render(); }
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startResize(e, id){
  e.preventDefault();
  const el = getBoard().elements.find(x => x.id === id);
  if(!el) return;
  const startX = e.clientX, startY = e.clientY;
  const origW = el.w, origH = el.h;
  const cardNode = document.querySelector('[data-id="'+id+'"]');

  function onMove(ev){
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    el.w = Math.max(120, origW + dx);
    el.h = Math.max(100, origH + dy);
    cardNode.style.width = el.w + 'px';
    cardNode.style.height = el.h + 'px';
    redrawThreadsOnly();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    dirty = true;
    render();
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function redrawThreadsOnly(){
  const board = getBoard();
  const svg = document.querySelector('#canvas > svg.threads');
  if(!svg) return;
  svg.innerHTML = buildThreadsSvg(board);
}

/* ---------------- GOALS PANEL ---------------- */
function buildGoalCharTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CHARACTERS.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'tab-btn tab-char' + (currentGoalChar === ch ? ' active' : '');
    b.textContent = ch;
    b.onclick = () => { currentGoalChar = ch; buildGoalCharTabs(); renderGoalsPanel(); };
    tabsEl.appendChild(b);
  });
}

function renderGoalsPanel(){
  ensureGoals();
  const grid = document.getElementById('goalsGrid');
  let html = '';
  GOAL_CATS.forEach(cat => {
    const entries = appState.goals[currentGoalChar][cat.key];
    html += `<div class="goal-col">
      <div class="goal-col-head"><span>${cat.label}</span><button class="add-goal-btn" data-cat="${cat.key}">+ Ekle</button></div>
      <div class="goal-list" data-cat="${cat.key}">`;
    entries.forEach(entry => { html += goalEntryHtml(entry); });
    html += `</div></div>`;
  });
  grid.innerHTML = html;
  attachGoalsEvents();
}

function goalEntryHtml(entry){
  const statusOptions = STATUSES.map(s =>
    `<option value="${s.key}" ${entry.status===s.key?'selected':''}>${s.emoji} ${s.label}</option>`
  ).join('');
  return `<div class="goal-entry" data-id="${entry.id}">
     <textarea class="goal-text" data-role="goal-text" placeholder="Hedefi yaz...">${escapeHtml(entry.text||'')}</textarea>
     <div class="goal-entry-foot">
       <select class="goal-status" data-role="goal-status">${statusOptions}</select>
       <button class="del-btn" data-role="goal-del" title="Sil">✕</button>
     </div>
   </div>`;
}

function attachGoalsEvents(){
  document.querySelectorAll('.add-goal-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      const entry = { id: uid(), text:'', status:'fikir' };
      appState.goals[currentGoalChar][cat].push(entry);
      dirty = true;
      renderGoalsPanel();
      setTimeout(()=>{
        const node = document.querySelector('.goal-entry[data-id="'+entry.id+'"] textarea');
        if(node) node.focus();
      }, 20);
    });
  });

  document.querySelectorAll('.goal-entry').forEach(entryNode => {
    const id = entryNode.dataset.id;
    const colNode = entryNode.closest('.goal-list');
    const cat = colNode.dataset.cat;

    const textArea = entryNode.querySelector('[data-role="goal-text"]');
    textArea.addEventListener('input', (e) => {
      const entry = appState.goals[currentGoalChar][cat].find(x => x.id === id);
      if(entry){ entry.text = e.target.value; dirty = true; }
    });

    const statusSel = entryNode.querySelector('[data-role="goal-status"]');
    statusSel.addEventListener('change', (e) => {
      const entry = appState.goals[currentGoalChar][cat].find(x => x.id === id);
      if(entry){ entry.status = e.target.value; dirty = true; }
    });

    const delBtn = entryNode.querySelector('[data-role="goal-del"]');
    delBtn.addEventListener('click', () => {
      appState.goals[currentGoalChar][cat] = appState.goals[currentGoalChar][cat].filter(x => x.id !== id);
      dirty = true;
      renderGoalsPanel();
    });
  });
}

/* ---------------- PLANS PANEL ---------------- */
document.getElementById('addPlanBtn').addEventListener('click', () => {
  ensurePlans();
  const plan = { id: uid(), plan:'', durum:'fikir' };
  PLAN_FIELDS.forEach(f => plan[f.key] = '');
  appState.plans.push(plan);
  dirty = true;
  renderPlansPanel();
  setTimeout(()=>{
    const node = document.querySelector('.plan-card[data-id="'+plan.id+'"] input[data-field="plan"]');
    if(node) node.focus();
  }, 20);
});

function renderPlansPanel(){
  ensurePlans();
  const list = document.getElementById('plansList');
  if(appState.plans.length === 0){
    list.innerHTML = `<div class="empty-hint" style="position:static;display:inline-block;">Henüz ortak plan yok. "+ Yeni Plan" ile başlayın.</div>`;
    return;
  }
  list.innerHTML = appState.plans.map(planCardHtml).join('');
  attachPlansEvents();
}

function planCardHtml(plan){
  const fieldsHtml = PLAN_FIELDS.map(f =>
    `<div class="plan-field full"><label>${f.label}</label><textarea data-field="${f.key}">${escapeHtml(plan[f.key]||'')}</textarea></div>`
  ).join('');
  const statusOptions = STATUSES.map(s =>
    `<option value="${s.key}" ${plan.durum===s.key?'selected':''}>${s.emoji} ${s.label}</option>`
  ).join('');
  return `<div class="plan-card" data-id="${plan.id}">
    <div class="plan-card-head">
       <span class="plan-title">🧩 ${escapeHtml(plan.plan) || 'Yeni Plan'}</span>
       <button class="del-btn" data-role="plan-del" title="Sil">✕</button>
    </div>
    <div class="plan-fields">
      <div class="plan-field full"><label>Plan</label><input type="text" data-field="plan" value="${escapeAttr(plan.plan||'')}"></div>
      ${fieldsHtml}
      <div class="plan-field"><label>Planın Şu Anki Durumu</label><select data-field="durum">${statusOptions}</select></div>
    </div>
  </div>`;
}

function attachPlansEvents(){
  document.querySelectorAll('.plan-card').forEach(card => {
    const id = card.dataset.id;
    const plan = appState.plans.find(p => p.id === id);
    if(!plan) return;

    card.querySelectorAll('[data-field]').forEach(field => {
      const key = field.dataset.field;
      const evt = (field.tagName === 'SELECT') ? 'change' : 'input';
      field.addEventListener(evt, (e) => {
        plan[key] = e.target.value;
        dirty = true;
        if(key === 'plan'){
          const titleNode = card.querySelector('.plan-title');
          if(titleNode) titleNode.textContent = '🧩 ' + (e.target.value || 'Yeni Plan');
        }
      });
    });

    const delBtn = card.querySelector('[data-role="plan-del"]');
    delBtn.addEventListener('click', () => {
      appState.plans = appState.plans.filter(p => p.id !== id);
      dirty = true;
      renderPlansPanel();
    });
  });
}
